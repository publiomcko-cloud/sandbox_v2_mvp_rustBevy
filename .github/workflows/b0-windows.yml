name: B0 Windows self-hosted build and tests

# Security: do not execute untrusted pull_request code on an organization runner.
on:
  push:
    branches:
      - main
      - 'feat/b0-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b0-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Install Rust into the self-hosted runner service account when not on PATH.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Runner identity and Rust toolchain
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME% (%RUNNER_OS%/%RUNNER_ARCH%)
          echo Computer: %COMPUTERNAME%
          where rustc
          rustc --version
          cargo --version

      - name: Formatting
        shell: cmd
        run: cargo fmt --all -- --check

      - name: Workspace unit tests
        shell: cmd
        run: cargo test --workspace --locked

      - name: Build Windows release
        shell: cmd
        run: cargo build --release --locked -p sandbox-game

      - name: Upload executable and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: b0-windows-org-runner-release
          path: |
            target/release/sandbox-game.exe
            Cargo.lock
          if-no-files-found: error
