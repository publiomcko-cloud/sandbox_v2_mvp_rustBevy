name: B0 Windows self-hosted build and tests

# Security: do not execute untrusted pull_request code on an organization runner.
on:
  push:
    branches:
      - main
      - 'feat/b0-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b0-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Runner identity and Rust toolchain
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME ($env:RUNNER_OS/$env:RUNNER_ARCH)"
          Write-Host "Computer: $env:COMPUTERNAME"
          rustc --version
          cargo --version

      - name: Formatting
        shell: powershell
        run: cargo fmt --all -- --check

      - name: Workspace unit tests
        shell: powershell
        run: cargo test --workspace --locked

      - name: Build Windows release
        shell: powershell
        run: cargo build --release --locked -p sandbox-game

      - name: Upload executable and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: b0-windows-org-runner-release
          path: |
            target/release/sandbox-game.exe
            Cargo.lock
          if-no-files-found: error
