name: B0 Windows self-hosted build and tests

# Security: do not execute untrusted pull_request code on an organization runner.
on:
  push:
    branches:
      - main
      - 'feat/b0-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b0-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Native Windows setup; avoids WSL bash and PowerShell execution policy.
      # Toolchain state remains under the runner temp directory, not the workspace.
      - name: Provision Rust 1.100.0 for service account
        shell: cmd
        env:
          CARGO_HOME: ${{ runner.temp }}\\b0-cargo
          RUSTUP_HOME: ${{ runner.temp }}\\b0-rustup
        run: |
          if not exist "%CARGO_HOME%\\bin\\rustup.exe" (
            curl.exe --proto =https --tlsv1.2 --retry 3 -fL -o "%RUNNER_TEMP%\\rustup-init.exe" https://win.rustup.rs/x86_64
            if errorlevel 1 exit /b 1
            "%RUNNER_TEMP%\\rustup-init.exe" -y --no-modify-path --default-toolchain none
            if errorlevel 1 exit /b 1
          )
          "%CARGO_HOME%\\bin\\rustup.exe" toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy --no-self-update
          if errorlevel 1 exit /b 1
          echo %CARGO_HOME%\\bin>>"%GITHUB_PATH%"
          echo CARGO_HOME=%CARGO_HOME%>>"%GITHUB_ENV%"
          echo RUSTUP_HOME=%RUSTUP_HOME%>>"%GITHUB_ENV%"

      - name: Runner identity and Rust toolchain
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME% (%RUNNER_OS%/%RUNNER_ARCH%)
          echo Computer: %COMPUTERNAME%
          where rustc
          rustc --version
          cargo --version

      - name: Formatting
        shell: cmd
        run: cargo fmt --all -- --check

      - name: Core revision and coordinate tests
        shell: cmd
        run: cargo test --locked -p sandbox-world-core -p sandbox-streaming

      - name: Workspace unit tests
        shell: cmd
        run: cargo test --workspace --locked

      - name: Build Windows release
        shell: cmd
        run: cargo build --release --locked -p sandbox-game

      - name: Package executable with GPU shader assets
        shell: cmd
        run: |
          if not exist "target\release\sandbox-game.exe" exit /b 1
          if not exist "assets\shaders\compute_mesh.wesl" exit /b 1
          if exist "dist\b0" rmdir /s /q "dist\b0"
          mkdir "dist\b0\assets\shaders"
          if errorlevel 1 exit /b 1
          copy /Y "target\release\sandbox-game.exe" "dist\b0\sandbox-game.exe"
          if errorlevel 1 exit /b 1
          copy /Y "assets\shaders\compute_mesh.wesl" "dist\b0\assets\shaders\compute_mesh.wesl"
          if errorlevel 1 exit /b 1
          copy /Y "Cargo.lock" "dist\b0\Cargo.lock"
          if errorlevel 1 exit /b 1
          if not exist "dist\b0\sandbox-game.exe" exit /b 1
          if not exist "dist\b0\assets\shaders\compute_mesh.wesl" exit /b 1

      - name: Upload standalone Windows release
        uses: actions/upload-artifact@v4
        with:
          name: b0-windows-org-runner-release
          path: dist/b0/
          if-no-files-found: error
