name: B2 WGSL and SDF validation

on:
  push:
    branches:
      - 'feat/b2-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b2-shader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shader-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.100.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: SDF deterministic baseline
        run: cargo test --locked -p sandbox-world-core
      - name: B2 Surface Nets WGSL validation
        run: cargo test --locked -p sandbox-density-gpu-validation b2_surface_nets_shader_parses_and_validates -- --nocapture
