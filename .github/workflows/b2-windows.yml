name: B2 Windows Bevy resident-mesh build

on:
  push:
    branches:
      - 'feat/b2-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b2-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --no-self-update
      - name: Rustfmt
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Full workspace regression
        shell: pwsh
        run: cargo test --workspace --locked
      - name: Windows Release executable
        shell: pwsh
        run: cargo build --release --locked -p sandbox-game
      - name: Package GPU shaders with executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/b2/assets | Out-Null
          Copy-Item target/release/sandbox-game.exe dist/b2/sandbox-game.exe
          Copy-Item Cargo.lock dist/b2/Cargo.lock
          Copy-Item assets/shaders dist/b2/assets/shaders -Recurse -Force
          foreach ($path in @(
            "dist/b2/sandbox-game.exe",
            "dist/b2/assets/shaders/compute_mesh.wesl",
            "dist/b2/assets/shaders/sdf_density.wgsl",
            "dist/b2/assets/shaders/surface_nets.wgsl"
          )) {
            if (-not (Test-Path $path)) { throw "Missing B2 distribution asset: $path" }
          }
      - name: Upload standalone B2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: b2-windows-gpu-resident
          path: dist/b2/
          if-no-files-found: error
