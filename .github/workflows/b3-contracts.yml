name: B3 streaming planner and SDF contracts

on:
  push:
    branches:
      - 'feat/b3-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b3-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.100.0
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Streaming horizon/retention/priority tests
        run: cargo test --locked -p sandbox-streaming -- --nocapture
      - name: Deterministic SDF and cave regression
        run: cargo test --locked -p sandbox-world-core
