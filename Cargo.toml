[workspace]
resolver = "3"
members = [
    "crates/world_core",
    "crates/streaming",
    "crates/gpu_terrain",
    "crates/game",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = "=0.20.1"
avian3d = "=0.8.0"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = 0
